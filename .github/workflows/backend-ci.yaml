name: Backend Test

on: 
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - dev-branch
    paths:
      - 'backend/**'

permissions:
  contents: read
    
jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    defaults: 
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django checks
        run: uv run python manage.py check

      - name: Run tests
        run: uv run python manage.py test
