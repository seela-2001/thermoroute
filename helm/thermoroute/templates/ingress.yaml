{{- if .Values.ingress.enabled }}


apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: thermoroute-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: thermoroute-backend 
                port: 
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: thermoroute-frontend 
                port: 
                  number: 3000

{{- end }}