services: 
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thermoroute_backend
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: thermoroute_db
    env_file:
      - ./backend/.env
    ports: 
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thermoroute_db"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  db_data:
