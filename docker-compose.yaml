services: 
  backend:
    build: ./backend
    container_name: thermoroute_backend
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - database
    networks:
      - thermoroute_net

  database:
    image: postgres:17
    container_name: thermoroute_db
    env_file:
      - ./backend/.env
    ports: 
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - thermoroute_net

  frontend:
    build: ./frontend
    container_name: thermoroute_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - thermoroute_net

volumes:
  db_data:

networks:
  thermoroute_net:
